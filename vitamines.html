 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة الفيتامينات - دليل تفاعلي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tahoma', sans-serif;
            background: linear-gradient(145deg, #f8faff 0%, #eef3f9 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            color: #1e2b3c;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            box-shadow: 0 12px 30px rgba(0, 20, 40, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #0b3b5c, #2a6f8f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.4rem;
        }

        .header p {
            font-size: 1.2rem;
            color: #2c4a62;
            opacity: 0.9;
            font-weight: 400;
            border-bottom: 2px dashed #b0c9dd;
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .subhead {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
            font-size: 1rem;
            font-weight: 500;
            color: #1f4662;
        }

        .subhead span {
            background: #d6e5f3;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.6);
        }

        /* FILTER TABS */
        .filter-section {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 2.5rem;
        }

        .filter-btn {
            padding: 0.6rem 1.8rem;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            background: #eaf1f9;
            color: #1f3b4f;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid transparent;
        }

        .filter-btn:hover {
            background: #d0e2f2;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(38, 97, 138, 0.12);
        }

        .filter-btn.active {
            background: #1f4b6e;
            color: white;
            border-color: #1f4b6e;
            box-shadow: 0 6px 14px rgba(26, 79, 114, 0.25);
        }

        /* CARDS GRID */
        .vitamin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
        }

        .vitamin-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 1.6rem 1.4rem 1.8rem;
            box-shadow: 0 8px 28px rgba(0, 20, 40, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .vitamin-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            border-radius: 32px 32px 0 0;
            background: linear-gradient(90deg, #6ea8d4, #3b7da0);
            opacity: 0.6;
        }

        .vitamin-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(24, 67, 99, 0.12);
            border-color: #b8d3ea;
        }

        .vitamin-card .icon {
            font-size: 2.8rem;
            line-height: 1;
            margin-bottom: 0.2rem;
        }

        .vitamin-card h3 {
            font-size: 1.7rem;
            font-weight: 700;
            margin: 0.2rem 0 0.1rem;
            color: #0b2a3f;
            letter-spacing: -0.3px;
        }

        .vitamin-card .subtype {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2a6a8a;
            background: #dcebf8;
            display: inline-block;
            padding: 0.15rem 1rem;
            border-radius: 30px;
            margin-bottom: 0.8rem;
            align-self: flex-start;
        }

        .vitamin-card .details {
            flex: 1;
            margin-top: 0.3rem;
        }

        .vitamin-card .details p {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 0.5rem;
            color: #1d3446;
        }

        .vitamin-card .details strong {
            color: #0f3a55;
            font-weight: 700;
        }

        .vitamin-card .badge {
            display: inline-block;
            margin-top: 0.6rem;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            background: #b8d1e7;
            color: #0a3147;
            align-self: flex-start;
        }

        .badge.water {
            background: #b3d9f0;
            color: #04577a;
        }

        .badge.fat {
            background: #f0e2b3;
            color: #7a6204;
        }

        /* FOOTER */
        .footer {
            margin-top: 3.5rem;
            text-align: center;
            color: #3d5e79;
            font-size: 0.95rem;
            border-top: 1px solid rgba(128, 163, 191, 0.25);
            padding-top: 1.8rem;
            opacity: 0.8;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 2.2rem;
            }
            .vitamin-grid {
                grid-template-columns: 1fr;
            }
            .filter-section {
                gap: 0.5rem;
            }
            .filter-btn {
                padding: 0.4rem 1.2rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <h1>🧪 دليل الفيتامينات</h1>
            <p>محاكاة تفاعلية · الأنواع · الفوائد · المصادر</p>
            <div class="subhead">
                <span>💧 ذائبة في الماء</span>
                <span>🧈 ذائبة في الدهون</span>
            </div>
        </div>

        <!-- FILTER -->
        <div class="filter-section" id="filterSection">
            <button class="filter-btn active" data-filter="all">الكل</button>
            <button class="filter-btn" data-filter="water">💧 مائي</button>
            <button class="filter-btn" data-filter="fat">🧈 دهني</button>
            <button class="filter-btn" data-filter="b-complex">🔬 مركب B</button>
        </div>

        <!-- VITAMIN GRID -->
        <div class="vitamin-grid" id="vitaminGrid"></div>

        <!-- FOOTER -->
        <div class="footer">
            <span>🌿 معلومات علمية موثوقة · لأغراض تعليمية</span>
        </div>
    </div>

    <script>
        (function() {
            // ---------- البيانات ----------
            const vitamins = [{
                id: 'A',
                name: 'فيتامين A',
                icon: '🥕',
                type: 'fat',
                subtype: 'ذائب في الدهون',
                benefits: 'يدعم صحة البصر، يقوي المناعة، يحافظ على صحة الجلد والأغشية المخاطية.',
                sources: 'الجزر، البطاطا الحلوة، الكبد، البيض، الخضار الورقية الداكنة.',
                deficiency: 'ضعف الرؤية الليلية، جفاف الجلد، ضعف المناعة.'
            }, {
                id: 'D',
                name: 'فيتامين D',
                icon: '☀️',
                type: 'fat',
                subtype: 'ذائب في الدهون',
                benefits: 'يعزز امتصاص الكالسيوم، صحة العظام والأسنان، يدعم المناعة والمزاج.',
                sources: 'أشعة الشمس، الأسماك الدهنية، صفار البيض، الأطعمة المدعمة.',
                deficiency: 'هشاشة العظام، ضعف العضلات، زيادة خطر العدوى.'
            }, {
                id: 'E',
                name: 'فيتامين E',
                icon: '🌰',
                type: 'fat',
                subtype: 'ذائب في الدهون',
                benefits: 'مضاد أكسدة قوي، يحمي الخلايا، يدعم صحة القلب والجلد.',
                sources: 'المكسرات، البذور، السبانخ، الأفوكادو، الزيوت النباتية.',
                deficiency: 'ضعف الأعصاب، فقر الدم، تلف الخلايا.'
            }, {
                id: 'K',
                name: 'فيتامين K',
                icon: '🥬',
                type: 'fat',
                subtype: 'ذائب في الدهون',
                benefits: 'ضروري لتخثر الدم، صحة العظام، تنظيم الكالسيوم.',
                sources: 'الخضار الورقية الخضراء، البروكلي، الزيوت، منتجات الألبان.',
                deficiency: 'نزيف مفرط، ضعف العظام، كدمات سهلة.'
            }, {
                id: 'B1',
                name: 'فيتامين B1 (ثيامين)',
                icon: '🌾',
                type: 'water',
                subtype: 'ذائب في الماء (B-complex)',
                benefits: 'يدعم استقلاب الطاقة، صحة الأعصاب، وظائف القلب والدماغ.',
                sources: 'الحبوب الكاملة، اللحوم، البقوليات، المكسرات.',
                deficiency: 'مرض البري بري، ضعف الأعصاب، التعب.'
            }, {
                id: 'B2',
                name: 'فيتامين B2 (ريبوفلافين)',
                icon: '🥛',
                type: 'water',
                subtype: 'ذائب في الماء (B-complex)',
                benefits: 'يساعد في إنتاج الطاقة، صحة الجلد والعينين، ونمو الخلايا.',
                sources: 'الحليب، البيض، اللحوم، الخضار الورقية، الحبوب المدعمة.',
                deficiency: 'تشقق الشفاه، التهاب اللسان، حساسية للضوء.'
            }, {
                id: 'B3',
                name: 'فيتامين B3 (نياسين)',
                icon: '🍗',
                type: 'water',
                subtype: 'ذائب في الماء (B-complex)',
                benefits: 'يدعم الجهاز العصبي، يخفض الكوليسترول، يحسن الدورة الدموية.',
                sources: 'الدجاج، التونة، الفول السوداني، الأفوكادو، الحبوب الكاملة.',
                deficiency: 'مرض البلاغرا، التعب، اضطرابات الجلد والهضم.'
            }, {
                id: 'B6',
                name: 'فيتامين B6 (بيريدوكسين)',
                icon: '🐟',
                type: 'water',
                subtype: 'ذائب في الماء (B-complex)',
                benefits: 'يساعد في إنتاج النواقل العصبية، تكوين الهيموغلوبين، تنظيم الهرمونات.',
                sources: 'الدواجن، الأسماك، البطاطس، الموز، الحمص.',
                deficiency: 'فقر الدم، الاكتئاب، ضعف المناعة.'
            }, {
                id: 'B9',
                name: 'فيتامين B9 (حمض الفوليك)',
                icon: '🥦',
                type: 'water',
                subtype: 'ذائب في الماء (B-complex)',
                benefits: 'ضروري لتكوين الحمض النووي ونمو الخلايا، مهم للحمل وصحة القلب.',
                sources: 'الخضار الورقية، الحمضيات، البقوليات، الحبوب المدعمة.',
                deficiency: 'فقر الدم الضخم الأرومات، عيوب الأنبوب العصبي للجنين.'
            }, {
                id: 'B12',
                name: 'فيتامين B12 (كوبالامين)',
                icon: '🥩',
                type: 'water',
                subtype: 'ذائب في الماء (B-complex)',
                benefits: 'يدعم تكوين خلايا الدم الحمراء، صحة الأعصاب، والوظائف المعرفية.',
                sources: 'اللحوم، الأسماك، البيض، منتجات الألبان، الأطعمة المدعمة.',
                deficiency: 'فقر الدم الخبيث، تنميل الأطراف، ضعف الذاكرة.'
            }, {
                id: 'C',
                name: 'فيتامين C',
                icon: '🍊',
                type: 'water',
                subtype: 'ذائب في الماء',
                benefits: 'مضاد أكسدة قوي، يعزز المناعة، يساعد في امتصاص الحديد، ويحافظ على الجلد.',
                sources: 'الحمضيات، الفراولة، الكيوي، الفلفل، البروكلي.',
                deficiency: 'مرض الأسقربوط، ضعف التئام الجروح، نزيف اللثة.'
            }, {
                id: 'B5',
                name: 'فيتامين B5 (بانتوثينيك)',
                icon: '🥑',
                type: 'water',
                subtype: 'ذائب في الماء (B-complex)',
                benefits: 'يساعد في استقلاب الدهون والكربوهيدرات، إنتاج الهرمونات، وصحة الجلد.',
                sources: 'الأفوكادو، اللحوم، الحبوب الكاملة، البيض، الفطر.',
                deficiency: 'التعب، الأرق، اضطرابات الجهاز الهضمي.'
            }];

            // ---------- DOM refs ----------
            const grid = document.getElementById('vitaminGrid');
            const filterBtns = document.querySelectorAll('.filter-btn');

            // ---------- عرض البطاقات ----------
            function renderVitamins(filter = 'all') {
                let filtered = vitamins;

                if (filter === 'water') {
                    filtered = vitamins.filter(v => v.type === 'water');
                } else if (filter === 'fat') {
                    filtered = vitamins.filter(v => v.type === 'fat');
                } else if (filter === 'b-complex') {
                    filtered = vitamins.filter(v => v.subtype.includes('B-complex'));
                }
                // 'all' لا يحتاج تصفية

                // إنشاء HTML
                let html = '';
                filtered.forEach(v => {
                    const badgeClass = v.type === 'water' ? 'water' : 'fat';
                    html += `
                        <div class="vitamin-card">
                            <div class="icon">${v.icon}</div>
                            <h3>${v.name}</h3>
                            <span class="subtype">${v.subtype}</span>
                            <div class="details">
                                <p><strong>⚕️ الفوائد:</strong> ${v.benefits}</p>
                                <p><strong>🥗 المصادر:</strong> ${v.sources}</p>
                                <p><strong>⚠️ نقصه:</strong> ${v.deficiency}</p>
                            </div>
                            <span class="badge ${badgeClass}">${v.type === 'water' ? '💧 مائي' : '🧈 دهني'}</span>
                        </div>
                    `;
                });

                if (filtered.length === 0) {
                    html = `<div style="grid-column:1/-1; text-align:center; padding:3rem; background:rgba(255,255,255,0.5); border-radius:40px; font-size:1.2rem; color:#2b577a;">لا توجد فيتامينات تطابق هذا التصنيف</div>`;
                }

                grid.innerHTML = html;
            }

            // ---------- تفعيل الفلتر ----------
            function setActiveFilter(activeFilter) {
                filterBtns.forEach(btn => {
                    const filterVal = btn.dataset.filter;
                    if (filterVal === activeFilter) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                renderVitamins(activeFilter);
            }

            // ---------- ربط الأزرار ----------
            filterBtns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const filter = this.dataset.filter;
                    setActiveFilter(filter);
                });
            });

            // ---------- عرض أولي ----------
            renderVitamins('all');

        })();
    </script>

</body>
</html>
